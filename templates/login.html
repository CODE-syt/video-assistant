<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Video Assistant</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2430;--mute:#5b6675;--line:#dfe3e9;--accent:#2456e5;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161a20;--card:#1f242c;--ink:#e8ebf0;--mute:#9aa4b2;--line:#323a46;--accent:#6b8cff;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:360px;display:grid;gap:12px}
h1{margin:0;font-size:1.3rem}label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:8px;padding:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600}
button.link{background:none;border:0;color:var(--accent);font-weight:400;padding:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#err{color:var(--err);min-height:1.4em;font-size:.9rem}
</style></head><body>
<form id="f"><h1 id="title">Sign in to Video Assistant</h1>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
<div id="err" role="alert"></div>
<button id="go">Sign in</button><button type="button" class="link" id="sw">Create an account</button></form>
<script>
let mode='login';const $=i=>document.getElementById(i);
$('sw').onclick=()=>{mode=mode==='login'?'register':'login';const r=mode==='register';
$('title').textContent=r?'Create your account':'Sign in to Video Assistant';$('go').textContent=r?'Create account':'Sign in';
$('sw').textContent=r?'I already have an account':'Create an account';$('pw').autocomplete=r?'new-password':'current-password';$('err').textContent=''};
$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;
try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:JSON.stringify({email:$('email').value,password:$('pw').value})});
const d=await r.json();if(r.ok)location='/';else $('err').textContent=d.error}catch{$('err').textContent='Network error. Try again.'}$('go').disabled=false};
</script></body></html>
